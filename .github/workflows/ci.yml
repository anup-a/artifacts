name: ci
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo "run gofmt"; exit 1; fi
      - name: start minio
        run: |
          # quay.io, not Docker Hub: anonymous Hub pulls are denied from GitHub
          # runners ("pull access denied for minio/minio"). quay.io is MinIO's
          # own second registry and needs no login.
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio server /data
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live >/dev/null && break; sleep 1; done
          # dl.min.io now returns 410 Gone for every mc build, so the client comes
          # from its container. Both commands run in one container because the
          # alias is written into that container's config.
          docker run --rm --network host --entrypoint sh quay.io/minio/mc -c \
            "mc alias set m http://localhost:9000 minioadmin minioadmin && mc mb m/artifacts-test"
      - name: test (sqlite + s3)
        env:
          TEST_S3: "1"
          S3_ENDPOINT: localhost:9000
          S3_BUCKET: artifacts-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_USE_SSL: "false"
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1
      # The store suite again, this time against real Postgres, so the
      # dialect-specific SQL (placeholders, upserts, locking) is covered.
      - name: test (postgres)
        env:
          TEST_PG_URL: "postgres://postgres:pg@localhost:5432/postgres?sslmode=disable"
        run: go test -race ./internal/store/
      - name: smoke
        run: ./scripts/smoke.sh
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - name: build and verify the committed bundle is current
        run: |
          npm run build
          if ! git diff --quiet -- dist/comments.js; then
            echo "dist/comments.js is stale; run 'npm --prefix runtime run build' and commit"
            git diff --stat -- dist/comments.js
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The CLI e2e suite builds and runs the real server.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm test
  image:
    needs: [go, runtime, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
