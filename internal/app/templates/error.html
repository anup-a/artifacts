{{define "content"}}
<div class="auth">
  <a class="brand auth-brand" href="/app/">{{template "icon" "mark"}}<span>Artifacts</span></a>
  <div class="card auth-card">
    <span class="status-code">{{.Data.Status}}</span>
    <h1>{{.Title}}</h1>
    <p>{{.Data.Message}}</p>
    {{if and .Data.RequestID (lt .Data.Status 500)}}<p class="muted">Request id <code>{{.Data.RequestID}}</code></p>{{end}}
    <p><a class="btn" href="/app/">{{template "icon" "arrow-left"}} Back to the app</a></p>
  </div>
</div>
{{end}}
