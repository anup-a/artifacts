{{define "content"}}
<div class="auth">
  <a class="brand auth-brand" href="/app/login">{{template "icon" "mark"}}<span>Artifacts</span></a>
  <div class="card auth-card">
    <span class="auth-icon">{{template "icon" "mail"}}</span>
    <h1>Check your inbox</h1>
    <p>If <strong>{{.Data.Email}}</strong> can receive mail, a sign-in link is on its way. It works once and expires in 15 minutes.</p>
    <p class="muted">Wrong address? <a class="link" href="/app/login">Use a different email</a>.</p>
  </div>
</div>
{{end}}
