# Validation deployment on Fly: one machine, sqlite on a Fly volume, local
# blob storage on that same volume, and Fly's edge terminating TLS for both
# hostnames. No Neon, no R2, no Caddy.
#
# Deploy from the repo root:
#   fly deploy --config deploy/fly.free.toml
#
# TRUST_PROXY_HEADERS is safe here because the machine has no public address
# of its own: every request arrives through Fly's proxy, which overwrites
# X-Forwarded-For with the real peer.

app = "artifacts-share"
# Singapore, not Mumbai: Fly no longer lists `bom` in `fly platform regions`,
# and sin is the nearest region it does offer.
primary_region = "sin"

# Not the repo-root Dockerfile: a Fly volume mounts root-owned, and the
# nonroot uid that image runs as cannot create the sqlite file in it.
# deploy/Dockerfile.fly explains the trade-off.
[build]
  # Relative to this file, not to the repo root. The build context is still the
  # directory `fly deploy` runs in, which must be the repo root.
  dockerfile = "Dockerfile.fly"

[env]
  ADDR = ":8080"
  DB = "sqlite"
  STORAGE = "local"
  DATA_DIR = "/data"
  # Pages are served from the apex so a share URL stays short: byagent.dev/a/<id>/.
  # The dashboard and API sit on a subdomain to keep published HTML off the
  # origin that holds dashboard sessions. It is `app`, not `api`: the same host
  # serves both /api/* and the /app/* dashboard, and the dashboard is the half a
  # person lands on from a sign-in email.
  PUBLIC_SHARE_ORIGIN = "https://byagent.dev"
  PUBLIC_API_ORIGIN = "https://app.byagent.dev"
  TRUST_PROXY_HEADERS = "true"
  # Publishing without an account: a 24-hour guest key, three public pages,
  # claimable from the dashboard. Needs web sign-in, which the secrets set.
  GUEST_PUBLISH = "on"

# ADMIN_TOKEN is not here on purpose: it is set with `fly secrets set`.

# Both hostnames reach the same app; the server routes on path, not on host.
[mounts]
  source = "artifacts_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # sqlite has a single writer and the volume attaches to one machine, so the
  # app must never be scaled horizontally or stopped out from under a publish.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
