services:
  artifacts:
    image: ghcr.io/anup-a/artifacts:latest
    ports: ["8080:8080"]
    environment:
      DB: ${DB:?set DB in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      STORAGE: ${STORAGE:?set STORAGE in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      KEY_SIGNING_SECRET: ${KEY_SIGNING_SECRET:?set KEY_SIGNING_SECRET in .env}
      PUBLIC_SHARE_ORIGIN: ${PUBLIC_SHARE_ORIGIN:?set PUBLIC_SHARE_ORIGIN in .env}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN in .env}
      # The box is reachable only through Cloudflare, which overwrites
      # CF-Connecting-IP / X-Forwarded-For, so per-IP rate limits may trust them.
      TRUST_PROXY_HEADERS: "true"
      # No ADMIN_TOKEN: the managed deployment issues per-user keys signed with
      # KEY_SIGNING_SECRET instead of a single shared admin token.
    restart: unless-stopped
