#cloud-config
# First boot of the byagent box (Ubuntu 24.04). provision.sh passes this as
# user-data. Docker, unattended security updates, and the app's directories;
# the app itself arrives later through ship.sh or CI.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - sqlite3
write_files:
  # Security updates install themselves; a reboot, when one is needed, waits
  # for 04:30 UTC. Docker restarts both containers on boot.
  - path: /etc/apt/apt.conf.d/52byagent-upgrades
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  # Key-only ssh. Hetzner already installs the project's ssh key for root.
  - path: /etc/ssh/sshd_config.d/10-byagent.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
runcmd:
  - systemctl enable --now docker
  - systemctl restart ssh
  - install -d -m 755 /opt/artifacts
  # The server runs as the distroless nonroot uid, which must own its data.
  - install -d -o 65532 -g 65532 -m 750 /opt/artifacts/data
