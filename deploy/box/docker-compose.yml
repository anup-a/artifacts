# byagent on one VPS (OVHcloud VPS-1), behind a Cloudflare Tunnel.
#
# cloudflared dials out to Cloudflare and carries byagent.dev and
# app.byagent.dev to the server (and mcp.byagent.dev to the MCP server) over the compose network, so the box opens no
# web ports at all: its firewall allows ssh and nothing else, and nobody can
# reach the app without passing Cloudflare (ufw admits ssh only). That is what makes
# TRUST_PROXY_HEADERS=true safe here: CF-Connecting-IP is set by Cloudflare,
# and the only other way in is 127.0.0.1 on the box itself.
#
# Lives at /opt/artifacts on the box next to .env (secrets, mode 600) and
# data/ (sqlite + blobs, owned by uid 65532). ship.sh and CI copy this file.
services:
  artifacts:
    # Loaded over ssh by ship.sh / CI (docker save | docker load); the box
    # never needs registry credentials for the private repo.
    image: ${ARTIFACTS_IMAGE:-artifacts:local}
    env_file: .env
    environment:
      ADDR: ":8080"
      DB: sqlite
      STORAGE: local
      DATA_DIR: /data
      TRUST_PROXY_HEADERS: "true"
    volumes: ["./data:/data"]
    # Loopback only, for health checks from the box. Never 0.0.0.0.
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The remote MCP server at mcp.byagent.dev/mcp (mcp/server.js). It holds
  # no keys or data: every call carries the caller's own byagent key and goes
  # to the public API like any CLI would.
  mcp:
    image: ${MCP_IMAGE:-byagent-mcp:local}
    environment:
      BYAGENT_API: https://app.byagent.dev
      PORT: "8090"
    ports: ["127.0.0.1:8090:8090"]
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    # --metrics serves cloudflared's own counters on the compose network for
    # the collector (tunnel requests, errors, edge connections); no port is
    # published.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [artifacts]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Metrics to Grafana Cloud. It starts only with COMPOSE_PROFILES=telemetry
  # in .env, next to GRAFANA_OTLP_ENDPOINT and GRAFANA_OTLP_AUTH, so a box
  # without those credentials runs exactly as before. See otel-collector.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [telemetry]
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root inside the container, to read the Docker socket for container
    # stats. Everything it mounts from the host is read-only.
    user: "0:0"
    environment:
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_OTLP_AUTH: ${GRAFANA_OTLP_AUTH:-}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 200m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
