app = "artifacts"
primary_region = "fra"
[build]
  image = "ghcr.io/anup-a/artifacts:latest"
[env]
  ADDR = ":8080"
  DB = "postgres"
  STORAGE = "s3"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
